<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEMStudio</title><link rel="stylesheet" href="./style.css"></head><body>

<svg style="display:none" aria-hidden="true"><defs>
<symbol id="i-map" viewBox="0 0 24 24"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2V5ZM9 3v16m6-14v16"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
<symbol id="i-left" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
<symbol id="i-right" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></symbol>
<symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16m5-16v16"/></symbol>
<symbol id="i-panels" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16m8-16v16"/></symbol>
<symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5"/></symbol>
</defs></svg>
<div id="viewport" aria-label="地形视口"></div><div class="window-edge" aria-hidden="true"></div><div class="title-drag" data-native-overlay data-tauri-drag-region aria-hidden="true"></div>
<nav class="window-controls" data-native-overlay aria-label="窗口"><button id="window-minimize" aria-label="最小化"><svg viewBox="0 0 16 16"><path d="M2 8h12"/></svg></button><button id="window-maximize" aria-label="最大化"><svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="1"/></svg></button><button id="window-close" aria-label="关闭"><svg viewBox="0 0 16 16"><path d="m3 3 10 10M13 3 3 13"/></svg></button></nav>
<div class="renderbar glass" data-native-overlay><span class="ready"><i class="dot"></i><output id="render-progress" aria-label="渲染采样">0 / 256</output></span><button id="render-toggle" disabled>渲染</button><button class="primary" id="show-output">导出</button></div>
<aside class="panel glass map-panel" data-native-overlay id="map-panel" aria-label="地形与外观"><div class="panelhead"><h2><svg><use href="#i-map"/></svg>地形</h2><button class="icon" data-hide="map-panel" title="收起面板" aria-label="收起面板"><svg><use href="#i-left"/></svg></button></div><div class="tabs" role="tablist" aria-label="地形分类"><button role="tab" aria-selected="true" aria-controls="map" id="tab-map">地图</button><button role="tab" aria-selected="false" aria-controls="appearance" id="tab-appearance" tabindex="-1">外观</button></div><div class="content"><section class="tabpanel" role="tabpanel" aria-labelledby="tab-map" id="map"><div class="map-asset"><span class="asset-icon"><svg viewBox="0 0 24 24"><path d="m2 18 7-12 4 6 3-4 6 10H2Z"/><path d="m6 11 3 2 2-2"/></svg></span><div><div class="asset-name" id="map-name" title=""></div></div></div><button class="wide" id="import-heightmap"><svg><use href="#i-upload"/></svg>导入图像</button><div id="map-fields"></div></section><section class="tabpanel" role="tabpanel" aria-labelledby="tab-appearance" id="appearance" hidden><button class="wide" id="import-texture" disabled><svg><use href="#i-upload"/></svg>导入贴图</button><div class="appearance-modes" role="group" aria-label="外观模式"><button data-appearance="texture" aria-pressed="false" disabled>贴图</button><button data-appearance="material" aria-pressed="true">材质</button><button data-appearance="elevation" aria-pressed="false">赋色</button></div><section data-appearance-panel="texture" hidden><div class="texture-asset"><span id="texture-name">未导入</span><span class="source-details" id="texture-details"></span></div><div id="texture-fields"></div></section><section data-appearance-panel="material" id="material-fields"></section><section data-appearance-panel="elevation" id="elevation-fields" hidden></section></section></div></aside>
<button class="glass reopen left" data-native-overlay id="show-map" aria-label="展开地图" title="展开地图" hidden><svg><use href="#i-map"/></svg></button>
<aside class="panel glass inspector" data-native-overlay id="inspector" aria-label="场景参数"><div class="panelhead"><h2><svg><use href="#i-sun"/></svg>场景</h2><button class="icon" data-hide="inspector" title="收起参数" aria-label="收起参数"><svg><use href="#i-right"/></svg></button></div><div class="tabs" role="tablist" aria-label="场景分类"><button role="tab" aria-selected="true" aria-controls="light" id="tab-light">光照</button><button role="tab" aria-selected="false" aria-controls="grading" id="tab-grading" tabindex="-1">调色</button></div><div class="content"><section class="tabpanel" role="tabpanel" aria-labelledby="tab-light" id="light"></section><section class="tabpanel" role="tabpanel" aria-labelledby="tab-grading" id="grading" hidden><button id="reset-grading">重置</button></section></div></aside>
<button class="glass reopen right" data-native-overlay id="show-inspector" title="展开参数" aria-label="展开参数" hidden><svg><use href="#i-sun"/></svg></button>

<section class="camera-popover glass" data-native-overlay role="region" aria-label="相机设置" id="camera" hidden></section>
<nav class="dock glass" data-native-overlay aria-label="视图操作"><button id="panels" title="切换面板 · Tab" aria-label="切换面板" aria-pressed="true"><svg><use href="#i-panels"/></svg></button><span class="divider"></span><button id="reset-camera" title="重置相机" aria-label="重置相机"><svg><use href="#i-reset"/></svg></button><button id="camera-toggle" aria-expanded="false" aria-controls="camera">相机</button><span class="divider"></span><button data-mode="perspective" aria-pressed="true">透视</button><button data-mode="orthographic" aria-pressed="false">正交</button><button data-mode="isometric" aria-pressed="false">等轴</button><span class="divider"></span><button id="toggle-grid" aria-pressed="true"><svg><use href="#i-grid"/></svg><span class="label">网格</span></button></nav>
<nav id="view-cube" class="view-cube" data-native-overlay aria-label="视图立方体"><svg viewBox="0 0 100 92" aria-label="方向"><g id="view-cube-faces" text-anchor="middle" dominant-baseline="central"></g></svg><button data-view="iso" aria-label="等轴视图">等轴</button></nav>

<dialog id="export-dialog" data-native-overlay aria-labelledby="export-title"><header class="export-header"><h2 id="export-title">导出</h2><button id="close-export" aria-label="关闭导出">✕</button></header><div class="export-layout"><section class="export-preview"><div class="preview-toolbar"><span id="preview-kind">当前视图</span><output id="preview-progress"></output><button id="preview-zoom-out" aria-label="缩小预览">−</button><output id="preview-zoom">100%</output><button id="preview-zoom-in" aria-label="放大预览">+</button><button id="preview-fit">适应</button><button id="refresh-preview">刷新预览</button></div><div class="preview-image"><img id="export-preview-image" alt="渲染预览" draggable="false"></div></section><section class="export-settings"><label class="field"><span class="field-line"><span>格式</span><select id="export-format" aria-label="导出格式"><option value="png">PNG</option><option value="geotiff">GeoTIFF</option></select></span></label><label class="field"><span class="field-line"><span>取景</span><select id="export-framing" aria-label="导出取景"><option value="view">当前视图</option><option value="source">原图正射</option></select></span></label><label class="field"><span class="field-line"><span>尺寸</span><select id="export-scale" aria-label="输出倍率"><option value="1">1×</option><option value="2">2×</option><option value="3">3×</option><option value="custom" disabled>自定义</option></select></span></label><section id="geo-options" hidden><label class="field"><span class="field-line"><span>范围</span><select id="export-extent" aria-label="正射范围"><option value="source">原范围</option><option value="shadow">包含阴影</option></select></span></label><div id="shadow-options" hidden></div></section><div id="output"></div><div id="postprocess"></div></section></div><section id="export-job" class="export-job" aria-label="导出进度" hidden><div class="export-job-labels"><output id="export-job-percent">0%</output><output id="export-job-remaining" role="status" aria-live="polite"></output></div><progress id="export-job-bar" max="100" value="0" aria-label="导出进度"></progress></section><div class="dialog-actions" id="export-actions"><button id="open-export-file" hidden>打开文件</button><button id="open-export-directory" hidden>打开目录</button></div></dialog>
<dialog id="error-dialog"><h2 class="error-title">操作失败</h2><p id="error-text"></p><div class="dialog-actions"><button id="close-error">确定</button></div></dialog>
<script type="module" src="./main.js"></script></body></html>
